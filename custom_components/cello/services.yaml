start_parking:
  fields:
    car:
      required: true
      example: "12345678"
      selector:
        text:
    city:
      example: 5
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    zone:
      example: 120
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    hours:
      example: 2
      selector:
        number:
          min: 0
          max: 72
          step: 0.5
          unit_of_measurement: h
    until:
      selector:
        datetime:
    accept_message:
      default: false
      selector:
        boolean:
stop_parking:
  fields:
    car:
      required: true
      example: "12345678"
      selector:
        text:
extend_parking:
  fields:
    car:
      required: true
      example: "12345678"
      selector:
        text:
    accept_message:
      default: false
      selector:
        boolean:
find_zones:
  fields:
    latitude:
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
