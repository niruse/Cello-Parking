  - type: grid
    cards:
    - type: heading
      heading: חניות אחרונות
      icon: mdi:history
    - type: custom:button-card
      entity: sensor.cello_spent_this_month
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      custom_fields:
        list: "[[[ \nconst a = states['sensor.cello_spent_this_month'].attributes;\nconst rows = a.last_parkings || [];\n\
          const inv = states['sensor.cello_last_invoice'];\nconst link = (href, text) => href ? `<a href=\"${href}\" target=\"\
          _blank\" style=\"flex:1;text-align:center;text-decoration:none;color:#fff;background:#0e8a8e;border-radius:999px;padding:9px\
          \ 0;font-weight:700;font-size:14px\">${text}</a>` : '';\nconst items = rows.map(p => {\n  const [d, t] = (p.started\
          \ || '').split(' ');\n  const end = (p.ended || '').split(' ')[1] || '';\n  const [cityName, ...zoneParts] = (p.where\
          \ || '').split(', ');\n  return `<div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px\
          \ solid var(--divider-color)\">\n    <div style=\"flex:none;width:40px;height:40px;border-radius:12px;background:rgba(41,197,200,.15);display:flex;align-items:center;justify-content:center\"\
          >\n      <ha-icon icon=\"mdi:parking\" style=\"color:#29c5c8\"></ha-icon></div>\n    <div style=\"flex:1;min-width:0\"\
          >\n      <div style=\"font-weight:700;font-size:15px\">${cityName}</div>\n      <div style=\"font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"\
          >${zoneParts.join(', ')} · ${(d || '').slice(0, 5)} · <span dir=\"ltr\">${(t || '').slice(0, 5)}–${end.slice(0,\
          \ 5)}</span></div>\n    </div>\n    <div style=\"font-weight:800;font-size:15px;white-space:nowrap\">₪${p.price}</div>\n\
          \  </div>`;\n}).join('');\nreturn `<div style=\"text-align:right\">\n  ${items || '<div style=\"padding:12px 0;color:var(--secondary-text-color)\"\
          >אין חניות החודש</div>'}\n  <div style=\"display:flex;gap:8px;margin-top:12px\">${link(a.report_pdf, '\U0001F4C4\
          \ דוח חניות')}${link(inv && inv.attributes.url, '\U0001F9FE חשבונית')}</div>\n</div>`;\n ]]]"
      styles:
        card:
        - border-radius: 22px
        - direction: rtl
        - box-shadow: 0 6px 18px rgba(0,0,0,.18)
        - padding: 6px 16px 16px
        grid:
        - grid-template-areas: '"list"'
        custom_fields:
          list:
          - justify-self: stretch
