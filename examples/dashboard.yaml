# Cello parking dashboard (example)
#
# Needs: the Cello integration and custom:button-card (HACS -> Frontend).
# Add it: Settings -> Dashboards -> Add dashboard -> New from scratch -> menu -> Raw configuration editor,
# paste this file, then replace:
#   12345678 / 123-45-678  -> your car's plate (entity ids use the plain digits)
#   "CITY – ZONE [111]"    -> a zone exactly as your car's "Parking zone" list shows it (Quick zone chips)
# For a second car, copy the car section and change its plate.
title: Cello
views:
- title: חניה
  path: cello
  icon: mdi:parking
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      entity: binary_sensor.cello_12345678_parking
      triggers_update:
      - sensor.cello_12345678_time_left
      - binary_sensor.cello_12345678_moved_while_parked
      - sensor.cello_12345678_location
      - select.cello_12345678_parking_zone
      - number.cello_12345678_park_for
      - sensor.cello_12345678_parking_cost
      - sensor.cello_12345678_parking_ends
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      custom_fields:
        plate: '<div style=''display:inline-flex;align-items:stretch;direction:ltr;border:2px solid #111;border-radius:7px;overflow:hidden;font-family:"Arial
          Black",Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35)''><div style=''background:#1f4fbf;color:#fff;font-size:9px;font-weight:700;padding:2px
          4px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1''><span>IL</span><span
          style=''font-size:8px''>ישראל</span></div><div style=''background:#f7d117;color:#111;font-size:20px;font-weight:900;padding:3px
          10px;letter-spacing:1px''>123-45-678</div></div>'
        chip: "[[[ \nconst P = states['binary_sensor.cello_12345678_parking'];\nconst on = !!P && P.state === 'on';\nconst\
          \ TL = states['sensor.cello_12345678_time_left'];\nconst left = TL && !isNaN(parseFloat(TL.state)) ? parseInt(TL.state)\
          \ : null;\nconst total = TL ? TL.attributes.total_minutes : null;\nconst M = states['binary_sensor.cello_12345678_moved_while_parked'];\n\
          const moved = !!M && M.state === 'on';\nconst L = states['sensor.cello_12345678_location'];\nconst dist = L ? L.attributes.distance_from_parking_m\
          \ : null;\nconst city = L && !['unknown','unavailable'].includes(L.state) ? L.state : null;\nconst Z = states['select.cello_12345678_parking_zone'];\n\
          const chosen = Z && Z.state !== '—' ? Z.state.replace(/\\s*\\[\\d+\\]$/, '') : null;\nconst H = states['number.cello_12345678_park_for'];\n\
          const hours = H ? parseFloat(H.state) : 0;\nconst opts = Z ? Z.attributes.options || [] : [];\nconst zid = P ? P.attributes.zone_id\
          \ : null;\nconst full = zid ? opts.find(o => o.endsWith('[' + zid + ']')) : null;\nconst zoneName = full ? full.replace(/\\\
          s*\\[\\d+\\]$/, '') : (P && P.attributes.zone) || '';\nconst S = states['sensor.cello_12345678_parking_started'];\n\
          const E = states['sensor.cello_12345678_parking_ends'];\nconst C = states['sensor.cello_12345678_parking_cost'];\n\
          const ok = s => s && !['unknown','unavailable'].includes(s.state);\nconst hhmm = s => ok(s) ? new Date(s.state).toLocaleTimeString('he-IL',\
          \ {hour: '2-digit', minute: '2-digit'}) : '—';\nconst fmtLeft = m => m === null ? '∞' : Math.floor(m / 60) + ':'\
          \ + String(m % 60).padStart(2, '0');\nconst durText = h => !h ? 'עד עצירה' : (h === 1 ? 'שעה' : (h === 2 ? 'שעתיים'\
          \ : h + ' שעות'));\n\nconst [txt, bg, fg] = moved ? ['\U0001F697 הרכב זז!', '#e5484d', '#fff'] : on ? ['\U0001F17F\
          ️ חונה', 'rgba(255,255,255,.22)', '#fff']\n  : ['לא חונה', 'var(--secondary-background-color)', 'var(--secondary-text-color)'];\n\
          return `<span style=\"background:${bg};color:${fg};display:inline-block;line-height:20px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap\"\
          >${txt}</span>`;\n ]]]"
        body: "[[[ \nconst P = states['binary_sensor.cello_12345678_parking'];\nconst on = !!P && P.state === 'on';\nconst\
          \ TL = states['sensor.cello_12345678_time_left'];\nconst left = TL && !isNaN(parseFloat(TL.state)) ? parseInt(TL.state)\
          \ : null;\nconst total = TL ? TL.attributes.total_minutes : null;\nconst M = states['binary_sensor.cello_12345678_moved_while_parked'];\n\
          const moved = !!M && M.state === 'on';\nconst L = states['sensor.cello_12345678_location'];\nconst dist = L ? L.attributes.distance_from_parking_m\
          \ : null;\nconst city = L && !['unknown','unavailable'].includes(L.state) ? L.state : null;\nconst Z = states['select.cello_12345678_parking_zone'];\n\
          const chosen = Z && Z.state !== '—' ? Z.state.replace(/\\s*\\[\\d+\\]$/, '') : null;\nconst H = states['number.cello_12345678_park_for'];\n\
          const hours = H ? parseFloat(H.state) : 0;\nconst opts = Z ? Z.attributes.options || [] : [];\nconst zid = P ? P.attributes.zone_id\
          \ : null;\nconst full = zid ? opts.find(o => o.endsWith('[' + zid + ']')) : null;\nconst zoneName = full ? full.replace(/\\\
          s*\\[\\d+\\]$/, '') : (P && P.attributes.zone) || '';\nconst S = states['sensor.cello_12345678_parking_started'];\n\
          const E = states['sensor.cello_12345678_parking_ends'];\nconst C = states['sensor.cello_12345678_parking_cost'];\n\
          const ok = s => s && !['unknown','unavailable'].includes(s.state);\nconst hhmm = s => ok(s) ? new Date(s.state).toLocaleTimeString('he-IL',\
          \ {hour: '2-digit', minute: '2-digit'}) : '—';\nconst fmtLeft = m => m === null ? '∞' : Math.floor(m / 60) + ':'\
          \ + String(m % 60).padStart(2, '0');\nconst durText = h => !h ? 'עד עצירה' : (h === 1 ? 'שעה' : (h === 2 ? 'שעתיים'\
          \ : h + ' שעות'));\n\nif (on) {\n  const pct = left !== null && total ? Math.max(0, Math.min(100, left / total *\
          \ 100)) : 100;\n  const warn = left !== null && left <= 15;\n  const ring = warn ? '#f5a524' : '#ffffff';\n  const\
          \ distLine = dist !== null && dist !== undefined\n    ? `<div style=\"margin-top:10px;font-size:12px;opacity:.9\"\
          >\U0001F4CD הרכב ${dist} מ' ממקום החניה</div>` : '';\n  const stat = (label, value) => `<div style=\"flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:8px\
          \ 6px;text-align:center\">\n      <div style=\"font-size:11px;opacity:.85\">${label}</div><div style=\"font-size:17px;font-weight:800;margin-top:2px\"\
          >${value}</div></div>`;\n  return `\n  <div style=\"display:flex;align-items:center;gap:16px;margin-top:14px\">\n\
          \    <div style=\"flex:none;width:126px;height:126px;border-radius:50%;background:conic-gradient(${ring} ${pct}%,\
          \ rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:104px;height:104px;border-radius:50%;background:${moved\
          \ ? '#c62f33' : '#139ea2'};box-shadow:inset 0 2px 8px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center\"\
          >\n        <div style=\"font-size:30px;font-weight:900;direction:ltr;line-height:1\">${fmtLeft(left)}</div>\n  \
          \      <div style=\"font-size:12px;opacity:.9;margin-top:4px\">${left === null ? 'ללא סיום' : 'נותרו'}</div>\n \
          \     </div>\n    </div>\n    <div style=\"flex:1;min-width:0;text-align:right\">\n      <div style=\"font-size:12px;opacity:.85\"\
          >אזור חניה</div>\n      <div style=\"font-size:19px;font-weight:800;line-height:1.25\">${zoneName}</div>\n     \
          \ ${distLine}\n    </div>\n  </div>\n  <div style=\"display:flex;gap:8px;margin-top:14px\">\n    ${stat('התחלה',\
          \ hhmm(S))}${stat('סיום', hhmm(E))}${stat('עלות', ok(C) ? '₪' + C.state : '—')}\n  </div>`;\n}\nconst where = city\
          \ ? `<div style=\"margin-top:6px;font-size:13px;color:var(--secondary-text-color)\">\U0001F4CD הרכב נמצא ב<b>${city}</b></div>`\
          \ : '';\nreturn `\n  <div style=\"margin-top:16px;text-align:right\">\n    <div style=\"font-size:26px;font-weight:900\"\
          >אין חניה פעילה</div>\n    ${where}\n    <div style=\"display:flex;gap:8px;margin-top:14px\">\n      <div style=\"\
          flex:2;background:var(--secondary-background-color);border-radius:14px;padding:9px 10px\">\n        <div style=\"\
          font-size:11px;color:var(--secondary-text-color)\">אזור לחניה הבאה</div>\n        <div style=\"font-size:15px;font-weight:700;margin-top:2px\"\
          >${chosen || 'לא נבחר — בחר למטה'}</div></div>\n      <div style=\"flex:1;background:var(--secondary-background-color);border-radius:14px;padding:9px\
          \ 10px\">\n        <div style=\"font-size:11px;color:var(--secondary-text-color)\">משך</div>\n        <div style=\"\
          font-size:15px;font-weight:700;margin-top:2px\">${durText(hours)}</div></div>\n    </div>\n  </div>`;\n ]]]"
      styles:
