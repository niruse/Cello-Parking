            \ + String(m % 60).padStart(2, '0');\nconst durText = h => !h ? 'עד עצירה' : (h === 1 ? 'שעה' : (h === 2 ? 'שעתיים'\
            \ : h + ' שעות'));\n\nif (moved) return 'linear-gradient(135deg, #b3261e, #e5484d)';\nif (on) return 'linear-gradient(135deg,\
            \ #0e8a8e, #29c5c8)';\nreturn 'var(--ha-card-background, var(--card-background-color))';\n ]]]"
        - color: "[[[ \nconst P = states['binary_sensor.cello_12345678_parking'];\nconst on = !!P && P.state === 'on';\nconst\
            \ TL = states['sensor.cello_12345678_time_left'];\nconst left = TL && !isNaN(parseFloat(TL.state)) ? parseInt(TL.state)\
            \ : null;\nconst total = TL ? TL.attributes.total_minutes : null;\nconst M = states['binary_sensor.cello_12345678_moved_while_parked'];\n\
            const moved = !!M && M.state === 'on';\nconst L = states['sensor.cello_12345678_location'];\nconst dist = L ?\
