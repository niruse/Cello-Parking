            \ ? L.state : null;\nconst Z = states['select.cello_12345678_parking_zone'];\nconst chosen = Z && Z.state !==\
            \ '—' ? Z.state.replace(/\\s*\\[\\d+\\]$/, '') : null;\nconst H = states['number.cello_12345678_park_for'];\n\
